name: Enterprise Multi-Framework QA & Performance Automation Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selenium-e2e-tests:
    name: Selenium WebDriver Web E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Web & Test Dependencies
        run: |
          cd web && npm ci
          cd ../tests && npm install

      - name: Build and Launch NestDirect Web Server
        run: |
          cd web
          npm run build
          npm run start &
          npx wait-on http://localhost:3000/api/health --timeout 30000

      - name: Run Selenium Headless Chrome E2E Suite
        run: |
          cd tests
          npm run test:selenium

      - name: Upload Selenium Test Reports & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-E2E-Reports
          path: |
            tests/selenium/reports/
            tests/selenium/reports/E2E_Report.xlsx

  appium-mobile-tests:
    name: Appium 2.x React Native / Android E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Appium 2.x & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Install Test Dependencies
        run: |
          cd tests && npm install

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Run Android Emulator & Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            cd android && ./gradlew assembleDebug
            cd ../tests && npm run test:appium || true

      - name: Upload Appium Mobile Reports & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Mobile-Reports
          path: |
            tests/appium/reports/
            tests/appium/reports/React_native_E2E_Report.xlsx

  k6-load-testing:
    name: Grafana k6 API Performance Load Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build & Start NestDirect Web Server
        run: |
          cd web && npm ci && npm run build
          npm run start &
          npx wait-on http://localhost:3000/api/health --timeout 30000

      - name: Install Grafana k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Execute k6 API Load Test Suite
        run: |
          k6 run load-tests/suite.js

      - name: Upload Load Testing Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-Load-Test-Results
          path: load-tests/
