name: Enterprise Multi-Framework QA & Performance Automation Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Selenium WebDriver Headless E2E Tests
  # ─────────────────────────────────────────────────────────────────────────────
  selenium-e2e-tests:
    name: 🖥️ Selenium WebDriver E2E Tests (Headless Chrome)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Web Dependencies
        run: |
          cd web
          npm install

      - name: Start NestDirect Web Server (Dev Mode)
        run: |
          cd web
          NODE_ENV=development nohup npx tsx server.ts > /tmp/selenium-server.log 2>&1 &
          sleep 8
          curl --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3000/api/health
          echo "✅ Server is UP on port 3000"

      - name: Install Test Dependencies
        run: |
          cd tests
          npm install

      - name: Install ChromeDriver (matching system Chrome)
        run: |
          npx -y chromedriver --detect_version

      - name: Run Selenium / API E2E Tests
        run: |
          cd tests/selenium
          BASE_URL=http://localhost:3000 npx mocha specs/*.spec.js --timeout 30000 --reporter mochawesome --reporter-options "reportDir=reports,reportFilename=index" || true
        env:
          CI: true

      - name: Upload Selenium Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-E2E-Reports
          path: tests/selenium/reports/

      - name: Show Server Logs on Failure
        if: failure()
        run: cat /tmp/selenium-server.log || true

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Grafana k6 API Load Testing
  # ─────────────────────────────────────────────────────────────────────────────
  k6-load-testing:
    name: 📊 Grafana k6 API Performance Load Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Web Dependencies
        run: |
          cd web
          npm install

      - name: Start NestDirect Web Server (Dev Mode)
        run: |
          cd web
          NODE_ENV=development nohup npx tsx server.ts > /tmp/k6-server.log 2>&1 &
          sleep 8
          curl --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3000/api/health
          echo "✅ Server is UP on port 3000"

      - name: Install Grafana k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6
          k6 version

      - name: Execute k6 Load Test Suite
        run: |
          k6 run load-tests/suite.js
        env:
          BASE_URL: http://localhost:3000

      - name: Upload k6 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-Load-Test-Results
          path: load-tests/

      - name: Show Server Logs on Failure
        if: failure()
        run: cat /tmp/k6-server.log || true
