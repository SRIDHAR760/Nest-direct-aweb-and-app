name: Enterprise Multi-Framework QA & Performance Automation Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Web API E2E Tests — Node.js HTTP (no browser required)
  # ─────────────────────────────────────────────────────────────────────────────
  web-api-e2e-tests:
    name: Web API E2E Tests (5 test cases)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Web Dependencies
        working-directory: web
        run: npm install

      - name: Start CI Server
        working-directory: web
        run: |
          node ci-server.cjs &
          for i in {1..20}; do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✅ CI Server is UP after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3000/api/health || (echo "❌ Server failed to start" && exit 1)

      - name: Install Test Dependencies
        working-directory: tests
        run: npm install

      - name: Run Web API E2E Tests
        working-directory: tests
        run: |
          mkdir -p selenium/reports
          node -e "
          process.env.BASE_URL = 'http://localhost:3000';
          const Mocha = require('mocha');
          const mocha = new Mocha({ timeout: 30000 });
          mocha.addFile('selenium/specs/seleniumE2E.spec.js');
          mocha.run(failures => process.exit(failures ? 1 : 0));
          "
        env:
          BASE_URL: http://localhost:3000
          CI: true

      - name: Upload E2E Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Web-API-E2E-Reports
          path: tests/selenium/reports/

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Grafana k6 Load Testing
  # ─────────────────────────────────────────────────────────────────────────────
  k6-load-testing:
    name: Grafana k6 Load Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Web Dependencies
        working-directory: web
        run: npm install

      - name: Start CI Server
        working-directory: web
        run: |
          node ci-server.cjs &
          for i in {1..20}; do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✅ CI Server is UP after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3000/api/health || (echo "❌ Server failed to start" && exit 1)

      - name: Install Grafana k6
        run: |
          sudo gpg --batch --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69 2>/dev/null || true
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6
          k6 version

      - name: Run k6 Load Test
        run: |
          k6 run load-tests/suite.js
        env:
          BASE_URL: http://localhost:3000

      - name: Upload k6 Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-Load-Test-Results
          path: load-tests/
