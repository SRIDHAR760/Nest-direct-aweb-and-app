name: Enterprise Multi-Framework QA & Performance Automation Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selenium-e2e-tests:
    name: Selenium WebDriver Web E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Web & Test Dependencies
        run: |
          cd web && npm install
          cd ../tests && npm install

      - name: Launch NestDirect Web Server
        run: |
          cd web
          npx tsx server.ts &
          npx wait-on http://localhost:3000/api/health --timeout 30000

      - name: Run Selenium Headless Chrome E2E Suite
        run: |
          cd tests
          npm run test:selenium || true

      - name: Upload Selenium Test Reports & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-E2E-Reports
          path: |
            tests/selenium/reports/

  k6-load-testing:
    name: Grafana k6 API Performance Load Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Launch NestDirect Web Server
        run: |
          cd web && npm install
          npx tsx server.ts &
          npx wait-on http://localhost:3000/api/health --timeout 30000

      - name: Install Grafana k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Execute k6 API Load Test Suite
        run: |
          k6 run load-tests/suite.js

      - name: Upload Load Testing Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-Load-Test-Results
          path: load-tests/
