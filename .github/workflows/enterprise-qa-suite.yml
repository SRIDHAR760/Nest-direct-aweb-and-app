name: Enterprise Multi-Framework QA & Performance Automation Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # JOB 1: Web API E2E Tests (Node.js HTTP — no browser required)
  # ─────────────────────────────────────────────────────────────────────
  selenium-e2e-tests:
    name: Web API E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Web Dependencies
        run: npm install
        working-directory: web

      - name: Start NestDirect Web Server
        run: |
          NODE_ENV=development node node_modules/.bin/tsx server.ts > /tmp/selenium-server.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✅ Server is UP"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          curl -sf http://localhost:3000/api/health || (cat /tmp/selenium-server.log && exit 1)
        working-directory: web

      - name: Install Test Dependencies
        run: npm install
        working-directory: tests

      - name: Run Web API E2E Test Suite
        run: |
          BASE_URL=http://localhost:3000 node_modules/.bin/mocha selenium/specs/*.spec.js \
            --timeout 30000 \
            --reporter mochawesome \
            --reporter-options "reportDir=selenium/reports,reportFilename=index,overwrite=true"
        working-directory: tests
        env:
          CI: true

      - name: Upload E2E Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Web-API-E2E-Reports
          path: tests/selenium/reports/

      - name: Show Server Logs on Failure
        if: failure()
        run: cat /tmp/selenium-server.log || true

  # ─────────────────────────────────────────────────────────────────────
  # JOB 2: Grafana k6 API Load Testing
  # ─────────────────────────────────────────────────────────────────────
  k6-load-testing:
    name: Grafana k6 Load Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Web Dependencies
        run: npm install
        working-directory: web

      - name: Start NestDirect Web Server
        run: |
          NODE_ENV=development node node_modules/.bin/tsx server.ts > /tmp/k6-server.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✅ Server is UP"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          curl -sf http://localhost:3000/api/health || (cat /tmp/k6-server.log && exit 1)
        working-directory: web

      - name: Install Grafana k6
        run: |
          sudo gpg --batch --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69 2>/dev/null || true
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6
          k6 version

      - name: Run k6 Load Test
        run: k6 run load-tests/suite.js
        env:
          BASE_URL: http://localhost:3000

      - name: Upload k6 Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-Load-Test-Results
          path: load-tests/

      - name: Show Server Logs on Failure
        if: failure()
        run: cat /tmp/k6-server.log || true
