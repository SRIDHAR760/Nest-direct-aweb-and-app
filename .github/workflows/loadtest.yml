name: Load Test & Security Audit Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-test-and-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        working-directory: web
        run: npm ci

      - name: Start CI Server
        working-directory: web
        env:
          RATE_LIMIT_MAX: 1000000
        run: |
          node ci-server.cjs &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          for i in {1..20}; do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null 2>&1; then
              echo "✅ Server UP after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/api/health | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['status'] == 'healthy', f'Bad status: {d}'
          print('✅ Health verified:', d['status'], '| uptime:', round(d['uptime'],2), 's')
          "

      - name: Execute Autocannon Load Test (50 VUs x 10s)
        run: |
          mkdir -p "web/Vulnerability Test Results"
          web/node_modules/.bin/autocannon \
            --connections 50 \
            --duration 10 \
            --json \
            http://127.0.0.1:3000/api/health \
            > "web/Vulnerability Test Results/Load_Test_Baseline_Results.json"

          python3 - << 'EOF'
          import json
          with open("web/Vulnerability Test Results/Load_Test_Baseline_Results.json") as f:
            d = json.load(f)
          reqs = d.get("requests", {})
          lat  = d.get("latency", {})
          print(f"✅ Total Requests : {reqs.get('total', 'N/A')}")
          print(f"   Avg RPS        : {reqs.get('average', 'N/A')}")
          print(f"   Avg Latency    : {lat.get('mean', 'N/A')} ms")
          print(f"   p99 Latency    : {lat.get('p99', 'N/A')} ms")
          EOF

      - name: Run npm Security Audit
        working-directory: web
        run: |
          mkdir -p "Vulnerability Test Results"
          npm audit --json > "Vulnerability Test Results/Vulnerability_Report.json" || true
          echo "✅ Security audit saved"

      - name: Generate Executive Summary
        run: |
          TIMESTAMP=$(date -u "+%Y-%m-%d %H:%M:%S UTC")
          python3 - << 'EOF'
          import json, os
          with open("web/Vulnerability Test Results/Load_Test_Baseline_Results.json") as f:
            d = json.load(f)
          reqs = d.get("requests", {})
          lat  = d.get("latency", {})
          summary = f"""# NestDirect — Load Test & Security Audit Report

          **CI Status: PASS ✅**

          | Parameter        | Value                                  |
          |------------------|----------------------------------------|
          | Target Endpoint  | http://127.0.0.1:3000/api/health       |
          | Virtual Users    | 50 concurrent connections              |
          | Duration         | 10 seconds                             |
          | Total Requests   | {reqs.get('total', 'N/A')}             |
          | Avg RPS          | {reqs.get('average', 'N/A')}           |
          | Avg Latency      | {lat.get('mean', 'N/A')} ms            |
          | p99 Latency      | {lat.get('p99', 'N/A')} ms             |

          ## Artifacts
          - Load_Test_Baseline_Results.json
          - Vulnerability_Report.json
          - Executive_Summary.md
          """
          with open("web/Vulnerability Test Results/Executive_Summary.md", "w") as f:
            f.write(summary)
          print("✅ Executive Summary generated")
          print(summary)
          EOF

      - name: Upload Load Test Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Load-Test-and-Security-Report
          path: "web/Vulnerability Test Results/"
