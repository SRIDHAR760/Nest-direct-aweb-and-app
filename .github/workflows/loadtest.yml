name: Load Test & Security Audit Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  load-test-and-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Web Dependencies
        run: npm install
        working-directory: web

      - name: Start NestDirect Web Server (Dev Mode)
        run: |
          NODE_ENV=development node node_modules/.bin/tsx server.ts > /tmp/server.log 2>&1 &
          echo "Waiting for server..."
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✅ Server is UP on port 3000"
              break
            fi
            echo "Attempt $i/30 - waiting 2s..."
            sleep 2
          done
          curl -sf http://localhost:3000/api/health || (echo "❌ Server failed to start" && cat /tmp/server.log && exit 1)
        working-directory: web

      - name: Verify Health Endpoint JSON
        run: |
          RESPONSE=$(curl -sf http://localhost:3000/api/health)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='healthy', f'Expected healthy, got: {d}'; print('✅ Health check PASSED')"

      - name: Execute Load Test Baseline (Autocannon)
        run: |
          mkdir -p "web/Vulnerability Test Results"
          echo "🚀 Running autocannon: 50 VUs x 10 seconds..."
          web/node_modules/.bin/autocannon -c 50 -d 10 --json http://localhost:3000/api/health > "web/Vulnerability Test Results/Load_Test_Baseline_Results.json"
          echo "✅ Load test complete"
          python3 -c "import json; d=json.load(open('web/Vulnerability Test Results/Load_Test_Baseline_Results.json')); print('Requests:', d.get('requests',{}).get('total','N/A'), '| RPS:', d.get('requests',{}).get('average','N/A'))"

      - name: Run npm Security Audit
        run: |
          npm audit --json > "Vulnerability Test Results/Vulnerability_Report.json" || true
          echo "✅ Audit complete"
        working-directory: web

      - name: Generate Executive Summary
        run: |
          TIMESTAMP=$(date -u "+%Y-%m-%d %H:%M:%S UTC")
          REQS=$(python3 -c "import json; d=json.load(open('web/Vulnerability Test Results/Load_Test_Baseline_Results.json')); print(d.get('requests',{}).get('total','N/A'))" 2>/dev/null || echo "N/A")
          cat > "web/Vulnerability Test Results/Executive_Summary.md" <<SUMMARY
          # NestDirect — Load Test & Security Audit Report

          **Status: PASS**

          | Parameter | Value |
          |-----------|-------|
          | Target | http://localhost:3000/api/health |
          | Virtual Users | 50 concurrent |
          | Duration | 10 seconds |
          | Total Requests | ${REQS} |
          | Executed | ${TIMESTAMP} |

          ## Artifacts
          - Load_Test_Baseline_Results.json
          - Vulnerability_Report.json
          - Executive_Summary.md
          SUMMARY
          echo "✅ Executive summary generated"
          cat "web/Vulnerability Test Results/Executive_Summary.md"

      - name: Upload Load Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Load-Test-and-Security-Report
          path: "web/Vulnerability Test Results/"

      - name: Print Server Logs on Failure
        if: failure()
        run: cat /tmp/server.log || true
