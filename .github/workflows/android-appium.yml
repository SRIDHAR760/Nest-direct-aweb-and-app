name: Android Build & Appium E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-appium:
    name: Android Build & Appium Tests (3 test cases)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APPIUM_HOME: ${{ github.workspace }}/.appium
      APK_PATH: ${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk
      APP_PACKAGE: com.nestdirect.app
      APP_ACTIVITY: com.nestdirect.app.MainActivity
      DEVICE_NAME: NestDirect API 35 Emulator

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Web and Test Dependencies
        run: |
          npm --prefix web ci
          npm --prefix tests ci

      - name: Build Web Application
        run: npm --prefix web run build

      - name: Start Local Web and API Server
        run: |
          nohup node web/ci-server.cjs > /tmp/ci-server-appium.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null 2>&1; then
              echo "NestDirect CI server is ready"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/api/health

      - name: Install UiAutomator2 Driver
        working-directory: tests
        run: npx appium driver install uiautomator2@8.2.2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Android and Run Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            chmod +x android/gradlew
            android/gradlew -p android testDebugUnitTest lintDebug assembleDebug --stacktrace
            adb reverse tcp:3000 tcp:3000
            nohup tests/node_modules/.bin/appium --port 4723 > /tmp/appium-server.log 2>&1 &
            for i in $(seq 1 30); do if curl -sf http://127.0.0.1:4723/status > /dev/null 2>&1; then echo "Appium server is ready"; break; fi; sleep 1; done
            curl -sf http://127.0.0.1:4723/status
            npm --prefix tests run test:appium

      - name: Show Logs on Failure
        if: failure()
        run: |
          cat /tmp/ci-server-appium.log || true
          cat /tmp/appium-server.log || true

      - name: Upload Android and Appium Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Android-Appium-Results
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/
            tests/appium/reports/
          if-no-files-found: warn
